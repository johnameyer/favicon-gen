<main class="main">
  <h1>Favicon Generator</h1>

  <div class="source-tabs" role="tablist">
    <button
      type="button"
      role="tab"
      class="source-tab"
      [class.active]="activeTab() === 'emoji'"
      [attr.aria-selected]="activeTab() === 'emoji'"
      (click)="setActiveTab('emoji')"
      data-testid="tab-emoji"
    >
      Emoji
    </button>
    <button
      type="button"
      role="tab"
      class="source-tab"
      [class.active]="activeTab() === 'upload'"
      [attr.aria-selected]="activeTab() === 'upload'"
      (click)="setActiveTab('upload')"
      data-testid="tab-upload"
    >
      Custom SVG
    </button>
  </div>

  @if (activeTab() === 'emoji') {
    <app-emoji-picker (emojiSelected)="onEmojiSelected($event)" />
  }
  @if (activeTab() === 'upload') {
    <app-svg-upload (svgSelected)="onSvgUploaded($event)" />
  }

  @if (selectionLoading()) {
    <p data-testid="selection-loading">Loading selected emoji…</p>
  }
  @if (selectionError()) {
    <p class="selection-error" data-testid="selection-error">{{ selectionError() }}</p>
  }
  <app-canvas-preview [layers]="selectedLayers()" (layersResolved)="onLayersResolved($event)" />

  @if (currentLayers()) {
    <app-recolor-panel [svgMarkup]="currentLayers()![0].svgMarkup" (colorsChanged)="onColorsChanged($event)" />
  }

  <div class="export-mode-tabs" role="tablist">
    <button
      type="button"
      role="tab"
      class="export-mode-tab"
      [class.active]="exportMode() === 'ico'"
      [attr.aria-selected]="exportMode() === 'ico'"
      (click)="setExportMode('ico')"
      data-testid="mode-ico"
    >
      ICO only
    </button>
    <button
      type="button"
      role="tab"
      class="export-mode-tab"
      [class.active]="exportMode() === 'bundle'"
      [attr.aria-selected]="exportMode() === 'bundle'"
      (click)="setExportMode('bundle')"
      data-testid="mode-bundle"
    >
      Full bundle
    </button>
  </div>

  <button type="button" [disabled]="!currentLayers()" (click)="download()">
    @if (exportMode() === 'ico') {
      Download favicon.ico
    } @else {
      Download bundle (.zip)
    }
  </button>
</main>
